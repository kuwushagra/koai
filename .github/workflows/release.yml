
name: koai Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate application version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_NUMBER=$(git rev-list --count HEAD)
          APP_VERSION="1.2.${COMMIT_NUMBER}"

          echo "Generated version: $APP_VERSION"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

          export APP_VERSION

          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));

            config.version = process.env.APP_VERSION;

            fs.writeFileSync(
              path,
              JSON.stringify(config, null, 2) + "\n"
            );
          '

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Rust targets
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.app_version }}
          releaseName: "koai ${{ steps.version.outputs.app_version }}"
          releaseBody: "Automated release. See changelog on website."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  android:
    runs-on: ubuntu-22.04

    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate application version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_NUMBER=$(git rev-list --count HEAD)
          APP_VERSION="1.2.${COMMIT_NUMBER}"

          echo "Generated version: $APP_VERSION"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

          export APP_VERSION

          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));

            config.version = process.env.APP_VERSION;

            fs.writeFileSync(
              path,
              JSON.stringify(config, null, 2) + "\n"
            );
          '

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install dependencies
        run: npm install

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Configure Android environment
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Initialize Tauri Android project
        run: npm run tauri android init

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${ANDROID_KEY_BASE64:?Missing ANDROID_KEY_BASE64}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"

          ANDROID_DIR="src-tauri/gen/android"
          KEYSTORE_PATH="$RUNNER_TEMP/koai-release.jks"

          printf '%s' "$ANDROID_KEY_BASE64" \
            | base64 --decode > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            > /dev/null

          cd "$ANDROID_DIR"

          {
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'password=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
          } > keystore.properties

          chmod 600 keystore.properties

      - name: Build Android Release APK
        run: npm run tauri android build -- --apk

      - name: Verify Android Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"
          APK_COUNT=0

          while IFS= read -r APK; do
            APK_COUNT=$((APK_COUNT + 1))

            echo "Verifying $APK"

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              verify --verbose "$APK"

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              verify --print-certs "$APK"

          done < <(find "$APK_DIR" -type f -path "*/release/*.apk")

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No Android release APK was generated."
            exit 1
          fi

      - name: Upload Android Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: koai-android-release-${{ steps.version.outputs.app_version }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          retention-days: 30

  android-release:
    runs-on: ubuntu-22.04
    needs:
      - publish
      - android

    steps:
      - name: Download Android Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: koai-android-release-${{ needs.android.outputs.app_version }}
          path: android-release

      - name: Upload Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.android.outputs.app_version }}
          files: android-release/*.apk
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
