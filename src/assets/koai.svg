<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8C3A9"/>
      <stop offset="55%" stop-color="#B49B83"/>
      <stop offset="100%" stop-color="#887665"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7D5C5"/>
      <stop offset="100%" stop-color="#D68F83"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E9"/>
      <stop offset="100%" stop-color="#EAD9C3"/>
    </linearGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#716961"/>
      <stop offset="100%" stop-color="#302D2A"/>
    </linearGradient>
  </defs>

  <!-- Overall padding -->
<g transform="translate(41 41) scale(0.85)">

    <!-- Large fluffy koala ears -->
    <path d="M86 105
      C63 116 27 104 17 75
      C5 43 27 12 57 17
      C87 18 109 51 112 91
      L107 116Z"
      fill="url(#fur)" stroke="#796B5D" stroke-width="3"/>

    <path d="M170 105
      C193 116 229 104 239 75
      C251 43 229 12 199 17
      C169 18 147 51 144 91
      L149 116Z"
      fill="url(#fur)" stroke="#796B5D" stroke-width="3"/>

    <!-- Ear fluff -->
    <g fill="url(#fur)" stroke="#796B5D" stroke-width="2.5" stroke-linejoin="round">
      <path d="M29 56 Q12 43 27 29 Q29 10 46 19 Q61 5 70 24"/>
      <path d="M227 56 Q244 43 229 29 Q227 10 210 19 Q195 5 186 24"/>
      <path d="M20 81 Q5 76 17 60"/>
      <path d="M236 81 Q251 76 239 60"/>
      <path d="M35 99 Q18 103 25 85"/>
      <path d="M221 99 Q238 103 231 85"/>
    </g>

    <!-- Inner ears -->
    <path d="M78 91
      C54 106 30 87 33 59
      C36 34 57 27 75 44
      C92 59 103 81 98 101Z"
      fill="url(#ear)" stroke="#AA8072" stroke-width="2.5"/>

    <path d="M178 91
      C202 106 226 87 223 59
      C220 34 199 27 181 44
      C164 59 153 81 158 101Z"
      fill="url(#ear)" stroke="#AA8072" stroke-width="2.5"/>

    <!-- Ear texture -->
    <g fill="none" stroke="#F9E0D2" stroke-width="3" stroke-linecap="round">
      <path d="M39 52 Q49 60 53 78"/>
      <path d="M55 39 Q70 55 75 77"/>
      <path d="M75 48 Q89 65 90 84"/>
      <path d="M217 52 Q207 60 203 78"/>
      <path d="M201 39 Q186 55 181 77"/>
      <path d="M181 48 Q167 65 166 84"/>
    </g>

    <!-- Round head -->
    <path d="M128 45
      C94 35 65 58 51 88
      C33 126 43 177 73 202
      C88 219 107 225 128 225
      C149 225 168 219 183 202
      C213 177 223 126 205 88
      C191 58 162 35 128 45Z"
      fill="url(#fur)" stroke="#796B5D" stroke-width="3"/>

    <!-- Fur around forehead -->
    <g fill="none" stroke="#E9D6BE" stroke-width="2.5" stroke-linecap="round">
      <path d="M92 59 Q100 51 108 54"/>
      <path d="M117 49 Q128 44 137 49"/>
      <path d="M148 54 Q157 51 165 59"/>
    </g>

    <!-- Smaller face and all facial features -->
    <g transform="translate(128 155) scale(0.84) translate(-128 -155)">

      <!-- Round muzzle -->
      <path d="M69 145
        C68 119 91 107 111 116
        Q128 124 145 116
        C165 107 188 119 187 145
        C187 177 163 197 128 198
        C93 197 69 177 69 145Z"
        fill="url(#muzzle)" stroke="#9B806D" stroke-width="2.5"/>

      <!-- Happy expressive eyes -->
      <g fill="#403832">
        <ellipse cx="96" cy="113" rx="8" ry="10"/>
        <ellipse cx="160" cy="113" rx="8" ry="10"/>
      </g>

      <!-- Refined eye highlights -->
      <g fill="#FFF9ED">
        <circle cx="98" cy="109" r="2.8"/>
        <circle cx="162" cy="109" r="2.8"/>
      </g>

      <!-- Happy eyebrows -->
      <g fill="none" stroke="#776454" stroke-width="2.5" stroke-linecap="round">
        <path d="M84 98 Q96 89 107 98"/>
        <path d="M149 98 Q160 89 172 98"/>
      </g>

      <!-- Large koala nose -->
      <path d="M128 119
        C116 119 105 128 107 142
        C109 157 121 167 128 170
        C135 167 147 157 149 142
        C151 128 140 119 128 119Z"
        fill="url(#nose)" stroke="#403A35" stroke-width="2.5"/>

      <!-- Subtle nose shine -->
      <path d="M116 132 Q122 126 131 129"
        fill="none" stroke="#C7B9A8" stroke-width="2.8" stroke-linecap="round"/>

      <circle cx="137" cy="137" r="1.8" fill="#A99D90" opacity="0.65"/>

      <!-- Big open happy smile -->
      <path d="M101 171
        Q128 191 155 171
        Q153 200 128 201
        Q103 200 101 171Z"
        fill="#713D39" stroke="#80675A" stroke-width="2.5"/>

      <!-- Upper teeth -->
      <path d="M109 178
        Q128 185 147 178
        Q143 190 128 190
        Q113 190 109 178Z"
        fill="#FFFDF3"/>

      <!-- Tongue -->
      <path d="M116 194
        Q128 186 140 194
        Q136 201 128 201
        Q120 201 116 194Z"
        fill="#ED8F91"/>

      <path d="M128 194 Q128 198 128 200"
        fill="none" stroke="#D46F79" stroke-width="1.5"/>

      <!-- Rosy cheeks -->
      <ellipse cx="80" cy="160" rx="16" ry="9" fill="#E6A09A" opacity="0.55"/>
      <ellipse cx="176" cy="160" rx="16" ry="9" fill="#E6A09A" opacity="0.55"/>

      <!-- Softer cheek highlights -->
      <g fill="none" stroke="#F9D0BF" stroke-width="2" stroke-linecap="round" opacity="0.85">
        <path d="M74 157 Q78 154 82 157"/>
        <path d="M167 157 Q171 154 175 157"/>
      </g>

    </g>

    <!-- Soft fur details -->
    <g fill="none" stroke="#E9D6BE" stroke-width="2.5" stroke-linecap="round">
      <path d="M58 106 Q65 98 73 98"/>
      <path d="M53 129 Q61 122 69 123"/>
      <path d="M198 106 Q191 98 183 98"/>
      <path d="M203 129 Q195 122 187 123"/>
      <path d="M70 185 Q79 194 89 195"/>
      <path d="M186 185 Q177 194 167 195"/>
      <path d="M103 213 Q115 219 125 217"/>
      <path d="M153 213 Q141 219 131 217"/>
    </g>

  </g>
</svg>